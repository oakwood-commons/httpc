name: Benchmark

on:
  pull_request:
    branches:
      - main
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'

permissions:
  pull-requests: write

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run PR benchmarks
        run: go test -bench=. -benchmem -count=6 -benchtime=50ms -run='^$' ./... > /tmp/bench-pr.txt

      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          clean: false

      - name: Run main benchmarks
        run: |
          if [ -f go.mod ]; then
            go test -bench=. -benchmem -count=6 -benchtime=50ms -run='^$' ./... > /tmp/bench-main.txt
          else
            echo "No go.mod on main branch; skipping baseline benchmarks" >&2
            touch /tmp/bench-main.txt
          fi

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260312031701-16a31bc5fbd0

      - name: Compare benchmarks
        id: benchstat
        run: |
          {
            echo 'RESULT<<EOF'
            benchstat /tmp/bench-main.txt /tmp/bench-pr.txt || true
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          header: benchmark
          message: |
            ## Benchmark Results

            <details><summary>Click to expand</summary>

            ```
            ${{ steps.benchstat.outputs.RESULT }}
            ```

            </details>
